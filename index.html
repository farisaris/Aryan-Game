<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<title>Aryan Adventure - Exact Proportion Edition</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000; overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    touch-action: none;
  }
  #stage {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  canvas {
    background: #000;
    width: 100%; max-width: 177.78vh; max-height: 56.25vw;
    outline: none; image-rendering: pixelated; image-rendering: crisp-edges;
  }
  #touch-pad {
    position: fixed; left: 0; right: 0; bottom: 24px;
    display: flex; justify-content: space-between; padding: 0 40px;
    pointer-events: none; z-index: 20; user-select: none;
  }
  .touch-group { display: flex; gap: 15px; pointer-events: auto; }
  .pad-btn {
    pointer-events: auto; width: 65px; height: 65px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(4px);
    border: 2px solid rgba(255, 255, 255, 0.5); color: #fff;
    font-size: 24px; font-weight: bold; display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .pad-btn:active, .pad-btn.active {
    background: rgba(255, 213, 79, 0.6); border-color: #ffd54f; transform: scale(0.95);
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="960" height="540" tabindex="0"></canvas>
    <div id="touch-pad">
      <div class="touch-group">
        <button id="btn-left" class="pad-btn">◀</button>
        <button id="btn-right" class="pad-btn">▶</button>
      </div>
      <div class="touch-group">
        <button id="btn-up" class="pad-btn">▲</button>
      </div>
    </div>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const pCanvas = document.createElement('canvas');
const pCtx = pCanvas.getContext('2d');

// 1. ASSET IMAGES (Dah selaraskan Bg .PNG.JPG ikut screenshot repo GitHub)
const bgImg = new Image(); bgImg.src = 'Bg .PNG.JPG';
const k1Img = new Image(); k1Img.src = 'K1.jpg.png';
const k2ItemImg = new Image(); k2ItemImg.src = 'K2.jpg.png';
const bImg = new Image(); bImg.src = 'B.jpg.png';

function loadImg(src) {
  const img = new Image();
  img.src = src;
  return img;
}

const framesRight = [
  loadImg('Kd.png'),
  loadImg('K2.png'),
  loadImg('K3.png')
];

const framesLeft = [
  loadImg('Ld.png'),
  loadImg('L2.png'),
  loadImg('L3.png')
];

// 2. LEVEL PLATFORMS (Fizik kolisi sahaja)
const platforms = [
  // Lantai Rumput Utama (Y: 465)
  { x: 0, y: 465, w: 960, h: 75 },
  
  // Platform Blok Kiri Atas
  { x: 156, y: 112, w: 76, h: 42 },
  
  // Platform Tangga 1 (Bawah ulat)
  { x: 235, y: 300, w: 76, h: 42 },
  
  // Platform Tangga 2 (Bawah kucing hitam)
  { x: 368, y: 188, w: 76, h: 42 },
  
  // Platform Kanan Atas
  { x: 598, y: 92, w: 76, h: 42 },
  
  // Platform Panjang Kanan (Bawah kucing oren)
  { x: 712, y: 242, w: 190, h: 42 }
];

// 3. SUSUNAN PROPORSI ITEM & KUCING
const floatingItems = [
  { img: bImg, x: 255, y: 240, w: 35, h: 60 },
  { img: k1Img, x: 388, y: 132, w: 38, h: 56 },
  { img: k2ItemImg, x: 770, y: 150, w: 42, h: 92 }
];

// 4. PLAYER OBJECT
const player = {
  x: 45, y: 340, w: 42, h: 125,
  speed: 4.5, velX: 0, velY: 0,
  jumping: false, grounded: false, facingLeft: false,
  currentFrame: 0, frameTimer: 0, frameSpeed: 6
};

// 5. INPUT CONTROLS
const keys = {};
window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Enter'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

function setupTouchButton(id, keyName) {
  const btn = document.getElementById(id);
  btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; btn.classList.add('active'); });
  btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; btn.classList.remove('active'); });
}
setupTouchButton('btn-left', 'ArrowLeft');
setupTouchButton('btn-right', 'ArrowRight');
setupTouchButton('btn-up', 'ArrowUp');

// 6. UPDATE LOGIC
function update() {
  if (keys['ArrowRight'] || keys['KeyD']) {
    player.velX = player.speed;
    player.facingLeft = false;
  } else if (keys['ArrowLeft'] || keys['KeyA']) {
    player.velX = -player.speed;
    player.facingLeft = true;
  } else {
    player.velX = 0;
  }

  if ((keys['ArrowUp'] || keys['Space'] || keys['Enter']) && player.grounded) {
    player.velY = -12.5;
    player.grounded = false;
  }

  player.velY += 0.55;
  player.x += player.velX;
  player.y += player.velY;

  player.grounded = false;
  for (let p of platforms) {
    if (
      player.x + player.w > p.x &&
      player.x < p.x + p.w &&
      player.y + player.h >= p.y &&
      player.y + player.h - player.velY <= p.y + 12 &&
      player.velY >= 0
    ) {
      player.y = p.y - player.h;
      player.velY = 0;
      player.grounded = true;
    }
  }

  if (player.x < 0) player.x = 0;
  if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

  // ANIMASI FRAME
  if (player.velX !== 0 && player.grounded) {
    player.frameTimer++;
    if (player.frameTimer >= player.frameSpeed) {
      player.currentFrame = (player.currentFrame + 1) % 3;
      player.frameTimer = 0;
    }
  } else {
    player.currentFrame = 0;
  }
}

// 7. HELPER FUNCTION UNTUK KECUALIKAN CHROMABG & DRAW
function drawProcessedImage(img, x, y, w, h) {
  if (!img.complete || img.naturalWidth === 0) return;
  
  pCanvas.width = img.width;
  pCanvas.height = img.height;
  pCtx.clearRect(0, 0, img.width, img.height);
  pCtx.drawImage(img, 0, 0);

  try {
    const imgData = pCtx.getImageData(0, 0, img.width, img.height);
    const data = imgData.data;
    for (let i = 0; i < data.length; i += 4) {
      if (data[i] < 20 && data[i+1] < 20 && data[i+2] < 20) {
        data[i+3] = 0;
      }
    }
    pCtx.putImageData(imgData, 0, 0);
  } catch(e) {}

  ctx.drawImage(pCanvas, 0, 0, img.width, img.height, x, y, w, h);
}

// 8. RENDER LOGIC
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Lukis Background Utama
  if (bgImg.complete && bgImg.naturalWidth !== 0) {
    ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
  }

  // Lukis Item & Kucing
  floatingItems.forEach(item => {
    drawProcessedImage(item.img, item.x, item.y, item.w, item.h);
  });

  // Lukis Watak Aryan
  const currentSet = player.facingLeft ? framesLeft : framesRight;
  const activeImg = currentSet[player.currentFrame];
  if (activeImg) {
    drawProcessedImage(activeImg, player.x, player.y, player.w, player.h);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
