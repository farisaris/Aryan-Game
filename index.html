<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<title>Aryan Adventure - Exact Design Replica</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000; overflow: hidden;
    font-family: sans-serif;
    touch-action: none;
  }
  #stage {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    background: #000;
    width: 100%; max-width: 177.78vh; max-height: 56.25vw;
    outline: none; image-rendering: pixelated;
  }
  #touch-pad {
    position: fixed; left: 0; right: 0; bottom: 24px;
    display: flex; justify-content: space-between; padding: 0 40px;
    pointer-events: none; z-index: 20; user-select: none;
  }
  .touch-group { display: flex; gap: 15px; pointer-events: auto; }
  .pad-btn {
    pointer-events: auto; width: 65px; height: 65px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(4px);
    border: 2px solid rgba(255, 255, 255, 0.5); color: #fff;
    font-size: 24px; font-weight: bold; display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .pad-btn:active { background: rgba(255, 213, 79, 0.6); }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="960" height="540" tabindex="0"></canvas>
    <div id="touch-pad">
      <div class="touch-group">
        <button id="btn-left" class="pad-btn">◀</button>
        <button id="btn-right" class="pad-btn">▶</button>
      </div>
      <div class="touch-group">
        <button id="btn-up" class="pad-btn">▲</button>
      </div>
    </div>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// 1. ASSET IMAGES
const bgImg = new Image(); bgImg.src = 'Bg .PNG.JPG';
const k1Img = new Image(); k1Img.src = 'K1.jpg.png';
const k2ItemImg = new Image(); k2ItemImg.src = 'K2.jpg.png';
const bImg = new Image(); bImg.src = 'B.jpg.png';

function loadImg(src) {
  const img = new Image(); img.src = src; return img;
}

const framesRight = [loadImg('Kd.png'), loadImg('K2.png'), loadImg('K3.png')];
const framesLeft = [loadImg('Ld.png'), loadImg('L2.png'), loadImg('L3.png')];

// 2. KOD LUKIS BOK BATA (MENGIKUT DESIGN DESIGN 100%)
const blockStructures = [
  // Platform Kiri Atas (3 blok)
  { x: 158, y: 110, cols: 3, rows: 2 },
  
  // Platform Tangga 1 - Bawah Ulat (3 blok)
  { x: 235, y: 300, cols: 3, rows: 2 },
  
  // Platform Tangga 2 - Bawah Kucing Hitam (3 blok)
  { x: 368, y: 190, cols: 3, rows: 2 },
  
  // Platform Kanan Atas (3 blok)
  { x: 600, y: 92, cols: 3, rows: 2 },
  
  // Platform Panjang Kanan - Bawah Kucing Oren (7 blok + 2 kotak ?)
  { x: 712, y: 230, cols: 7, rows: 2, hasQuestion: true }
];

// Physical Platforms for Collision
const platforms = [
  // Lantai Rumput Utama (Diubah Y: 470 supaya kaki jejak rumput)
  { x: 0, y: 470, w: 960, h: 70 },
  { x: 235, y: 300, w: 76, h: 40 },
  { x: 368, y: 190, w: 76, h: 40 },
  { x: 712, y: 230, w: 190, h: 40 }
];

// 3. SUSUNAN PROPORSI ITEM & KUCING
const items = [
  // Ulat (Duduk atas platform 1)
  { img: bImg, x: 258, y: 252, h: 48, collected: false },
  
  // Kucing Hitam-Putih (Duduk atas platform 2)
  { img: k1Img, x: 388, y: 140, h: 50, collected: false },
  
  // Kucing Oren (Duduk atas platform 3)
  { img: k2ItemImg, x: 772, y: 152, h: 78, collected: false }
];

// 4. PLAYER ARYAN (Kaki tepat berdiri atas rumput)
const player = {
  x: 42, y: 352, h: 118,
  speed: 4, velX: 0, velY: 0,
  grounded: false, facingLeft: false,
  currentFrame: 0, frameTimer: 0, frameSpeed: 7
};

// 5. HELPER LUKIS SPRITE PROPORSI
function drawSprite(img, x, y, targetHeight) {
  if (!img.complete || img.naturalWidth === 0) return;
  const ratio = img.naturalWidth / img.naturalHeight;
  const targetWidth = targetHeight * ratio;
  ctx.drawImage(img, x, y, targetWidth, targetHeight);
}

function getSpriteWidth(img, targetHeight) {
  if (!img.complete || img.naturalHeight === 0) return 40;
  return targetHeight * (img.naturalWidth / img.naturalHeight);
}

// 6. HELPER LUKIS BATA & KOTAK QUESTION
function drawCustomBlocks() {
  const blockSize = 26;
  
  blockStructures.forEach(b => {
    for (let r = 0; r < b.rows; r++) {
      for (let c = 0; c < b.cols; c++) {
        const bx = b.x + (c * blockSize);
        const by = b.y + (r * blockSize);
        
        // Cek kalau kotak ? di platform kanan
        if (b.hasQuestion && r === 0 && (c === 2 || c === 4)) {
          // Kotak Question Mark (?)
          ctx.fillStyle = '#f7b731';
          ctx.fillRect(bx, by, blockSize, blockSize);
          ctx.strokeStyle = '#a55ee0';
          ctx.lineWidth = 2;
          ctx.strokeRect(bx, by, blockSize, blockSize);
          
          ctx.fillStyle = '#000';
          ctx.font = 'bold 16px sans-serif';
          ctx.fillText('?', bx + 7, by + 19);
        } else {
          // Blok Bata Merah
          ctx.fillStyle = '#b33939';
          ctx.fillRect(bx, by, blockSize, blockSize);
          ctx.strokeStyle = '#4b1212';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(bx, by, blockSize, blockSize);
          
          // Tekstur garisan bata
          ctx.beginPath();
          ctx.moveTo(bx, by + 13); ctx.lineTo(bx + blockSize, by + 13);
          ctx.moveTo(bx + 13, by); ctx.lineTo(bx + 13, by + 13);
          ctx.stroke();
        }
      }
    }
  });
}

// 7. INPUT CONTROLS
const keys = {};
window.addEventListener('keydown', (e) => { keys[e.code] = true; });
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

function setupTouch(id, key) {
  const btn = document.getElementById(id);
  btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
  btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
}
setupTouch('btn-left', 'ArrowLeft');
setupTouch('btn-right', 'ArrowRight');
setupTouch('btn-up', 'ArrowUp');

// 8. UPDATE GAME LOGIC
function update() {
  if (keys['ArrowRight'] || keys['KeyD']) {
    player.velX = player.speed;
    player.facingLeft = false;
  } else if (keys['ArrowLeft'] || keys['KeyA']) {
    player.velX = -player.speed;
    player.facingLeft = true;
  } else {
    player.velX = 0;
  }

  if ((keys['ArrowUp'] || keys['Space']) && player.grounded) {
    player.velY = -12;
    player.grounded = false;
  }

  player.velY += 0.55;
  player.x += player.velX;
  player.y += player.velY;

  const playerW = getSpriteWidth(framesRight[0], player.h);

  // Fizik platform (Pijak rumput & bata)
  player.grounded = false;
  for (let p of platforms) {
    if (
      player.x + playerW > p.x &&
      player.x < p.x + p.w &&
      player.y + player.h >= p.y &&
      player.y + player.h - player.velY <= p.y + 12 &&
      player.velY >= 0
    ) {
      player.y = p.y - player.h;
      player.velY = 0;
      player.grounded = true;
    }
  }

  // Sempadan Skrin
  if (player.x < 0) player.x = 0;
  if (player.x + playerW > canvas.width) player.x = canvas.width - playerW;

  // Kutip Item (Hilang bila disentuh)
  items.forEach(item => {
    if (!item.collected) {
      const itemW = getSpriteWidth(item.img, item.h);
      if (
        player.x < item.x + itemW &&
        player.x + playerW > item.x &&
        player.y < item.y + item.h &&
        player.y + player.h > item.y
      ) {
        item.collected = true;
      }
    }
  });

  // Animasi Jalan
  if (player.velX !== 0 && player.grounded) {
    player.frameTimer++;
    if (player.frameTimer >= player.frameSpeed) {
      player.currentFrame = (player.currentFrame + 1) % 3;
      player.frameTimer = 0;
    }
  } else {
    player.currentFrame = 0;
  }
}

// 9. RENDER LOGIC
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 1. Latar Belakang
  if (bgImg.complete && bgImg.naturalWidth !== 0) {
    ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
  }

  // 2. Lukis Blok Bata
  drawCustomBlocks();

  // 3. Lukis Items
  items.forEach(item => {
    if (!item.collected) {
      drawSprite(item.img, item.x, item.y, item.h);
    }
  });

  // 4. Lukis Watak Aryan
  const currentSet = player.facingLeft ? framesLeft : framesRight;
  const activeImg = currentSet[player.currentFrame] || currentSet[0];
  drawSprite(activeImg, player.x, player.y, player.h);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
