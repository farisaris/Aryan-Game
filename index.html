<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<title>Aryan Adventure</title>

<style>

*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    touch-action:none;
}

#stage{
    position:fixed;
    inset:0;

    width:100vw;
    height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#000;
}

#game{
    display:block;

    width:min(100vw,177.7778vh);
    height:min(56.25vw,100vh);

    aspect-ratio:16 / 9;

    background:#000;

    image-rendering:pixelated;
    image-rendering:crisp-edges;
}

/* =========================
   TOUCH CONTROLS
   ========================= */

#touch-pad{
    position:fixed;

    left:0;
    right:0;

    bottom:max(25px,env(safe-area-inset-bottom));

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 55px;

    pointer-events:none;

    z-index:50;
}

.touch-group{
    display:flex;
    gap:14px;

    pointer-events:auto;
}

.pad-btn{
    width:70px;
    height:70px;

    border-radius:50%;

    border:2px solid rgba(255,255,255,.65);

    background:rgba(60,60,60,.65);

    color:white;

    font-size:27px;
    font-weight:bold;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:0;
    margin:0;

    outline:none;

    -webkit-tap-highlight-color:transparent;

    touch-action:none;
}

.pad-btn:active{
    background:rgba(255,255,255,.35);
    transform:scale(.96);
}

</style>
</head>

<body>

<div id="stage">

    <canvas
        id="game"
        width="960"
        height="540">
    </canvas>

</div>


<div id="touch-pad">

    <div class="touch-group">

        <button
            id="btn-left"
            class="pad-btn">
            ◀
        </button>

        <button
            id="btn-right"
            class="pad-btn">
            ▶
        </button>

    </div>


    <div class="touch-group">

        <button
            id="btn-up"
            class="pad-btn">
            ▲
        </button>

    </div>

</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;

const W = 960;
const H = 540;


/* =====================================================
   IMAGE LOADER
===================================================== */

function loadImg(src){

    const img = new Image();

    img.src = src;

    return img;
}


/* =====================================================
   ASSETS
===================================================== */

const bgImg =
loadImg("Bg.jpg");

const bImg =
loadImg("B.png");

const k1Img =
loadImg("K1.png");

const k2Img =
loadImg("K2.png");


/* ARYAN */

const framesRight = [

    loadImg("Rd.png"),
    loadImg("R1.png"),
    loadImg("R2.png")

];

const framesLeft = [

    loadImg("Ld.png"),
    loadImg("L1.png"),
    loadImg("L2.png")

];


/* =====================================================
   WORLD
===================================================== */

const GROUND_Y = 450;


/* =====================================================
   BRICK SETTINGS
===================================================== */

const BRICK_W = 26;
const BRICK_H = 20;


/* =====================================================
   BRICK STRUCTURES
===================================================== */

const blockStructures = [

    {
        x:158,
        y:110,
        cols:3,
        rows:2
    },

    {
        x:235,
        y:300,
        cols:3,
        rows:2
    },

    {
        x:368,
        y:190,
        cols:3,
        rows:2
    },

    {
        x:600,
        y:92,
        cols:3,
        rows:2
    },

    {
        x:712,
        y:230,
        cols:7,
        rows:2,
        questions:true
    }

];


/* =====================================================
   PIPE
===================================================== */

const pipe = {

    x:555,
    y:350,

    w:70,
    h:100

};


/* =====================================================
   PHYSICS PLATFORMS
===================================================== */

const platforms = [

    /* ground */

    {
        x:0,
        y:GROUND_Y,
        w:W,
        h:90
    },


    /* bricks */

    {
        x:158,
        y:110,
        w:78,
        h:BRICK_H
    },

    {
        x:235,
        y:300,
        w:78,
        h:BRICK_H
    },

    {
        x:368,
        y:190,
        w:78,
        h:BRICK_H
    },

    {
        x:600,
        y:92,
        w:78,
        h:BRICK_H
    },

    {
        x:712,
        y:230,
        w:182,
        h:BRICK_H
    },


    /* pipe */

    {
        x:pipe.x,
        y:pipe.y,
        w:pipe.w,
        h:8
    }

];


/* =====================================================
   ITEMS
===================================================== */

const items = [

    {
        img:bImg,

        x:257,
        y:254,

        w:34,
        h:46,

        collected:false
    },

    {
        img:k1Img,

        x:388,
        y:136,

        w:38,
        h:54,

        collected:false
    },

    {
        img:k2Img,

        x:775,
        y:150,

        w:38,
        h:80,

        collected:false
    }

];


/* =====================================================
   PLAYER
===================================================== */

const player = {

    x:42,

    y:GROUND_Y - 110,

    w:40,
    h:110,

    speed:4,

    velX:0,
    velY:0,

    gravity:.55,

    jumpPower:12,

    grounded:false,

    facingLeft:false,

    currentFrame:0,

    frameTimer:0,

    frameSpeed:7

};


/* =====================================================
   INPUT
===================================================== */

const keys = {};


/* KEYBOARD */

window.addEventListener(
    "keydown",
    function(e){

        keys[e.code] = true;

        if(
            e.code === "ArrowLeft" ||
            e.code === "ArrowRight" ||
            e.code === "ArrowUp" ||
            e.code === "Space"
        ){

            e.preventDefault();

        }

    }
);


window.addEventListener(
    "keyup",
    function(e){

        keys[e.code] = false;

    }
);


/* =====================================================
   TOUCH
===================================================== */

function setupTouch(id,key){

    const button =
    document.getElementById(id);


    function down(e){

        e.preventDefault();

        keys[key] = true;

    }


    function up(e){

        e.preventDefault();

        keys[key] = false;

    }


    button.addEventListener(
        "touchstart",
        down,
        {passive:false}
    );

    button.addEventListener(
        "touchend",
        up,
        {passive:false}
    );

    button.addEventListener(
        "touchcancel",
        up,
        {passive:false}
    );


    button.addEventListener(
        "mousedown",
        down
    );

    button.addEventListener(
        "mouseup",
        up
    );

    button.addEventListener(
        "mouseleave",
        up
    );

}


setupTouch(
    "btn-left",
    "ArrowLeft"
);

setupTouch(
    "btn-right",
    "ArrowRight"
);

setupTouch(
    "btn-up",
    "ArrowUp"
);


/* =====================================================
   BACKGROUND
===================================================== */

function drawBackground(){

    if(
        bgImg.complete &&
        bgImg.naturalWidth > 0
    ){

        ctx.drawImage(
            bgImg,
            0,
            0,
            W,
            H
        );

    }

}


/* =====================================================
   PIXEL BRICK
===================================================== */

function drawBrick(x,y){

    /*
       Brick dibuat sendiri.

       Ini SENGAJA tak guna Bl.png
       supaya transparent padding asset
       tak boleh buat brick jadi line.
    */


    /* base */

    ctx.fillStyle =
    "#9e3f20";

    ctx.fillRect(
        x,
        y,
        BRICK_W,
        BRICK_H
    );


    /* brick top */

    ctx.fillStyle =
    "#c45b2b";

    ctx.fillRect(
        x+1,
        y+1,
        BRICK_W-2,
        7
    );


    /* brick bottom */

    ctx.fillStyle =
    "#7d2c18";

    ctx.fillRect(
        x+1,
        y+15,
        BRICK_W-2,
        4
    );


    /* mortar */

    ctx.fillStyle =
    "#542316";


    /* horizontal */

    ctx.fillRect(
        x,
        y+8,
        BRICK_W,
        2
    );


    /* vertical top */

    ctx.fillRect(
        x+12,
        y,
        2,
        8
    );


    /* vertical bottom */

    ctx.fillRect(
        x+5,
        y+10,
        2,
        10
    );


    /* highlights */

    ctx.fillStyle =
    "#e47a3a";

    ctx.fillRect(
        x+2,
        y+2,
        9,
        2
    );

}


/* =====================================================
   QUESTION BLOCK
===================================================== */

function drawQuestionBlock(x,y){

    /* border */

    ctx.fillStyle =
    "#8b521d";

    ctx.fillRect(
        x,
        y,
        BRICK_W,
        BRICK_H
    );


    /* yellow */

    ctx.fillStyle =
    "#f5b934";

    ctx.fillRect(
        x+2,
        y+2,
        BRICK_W-4,
        BRICK_H-4
    );


    /* highlight */

    ctx.fillStyle =
    "#ffe27a";

    ctx.fillRect(
        x+4,
        y+3,
        7,
        2
    );


    /* question */

    ctx.fillStyle =
    "#ffffff";

    ctx.font =
    "bold 16px Arial";

    ctx.textAlign =
    "center";

    ctx.textBaseline =
    "middle";

    ctx.fillText(
        "?",
        x + BRICK_W/2,
        y + BRICK_H/2 + 1
    );


    ctx.textAlign =
    "left";

    ctx.textBaseline =
    "alphabetic";

}


/* =====================================================
   DRAW ALL BRICKS
===================================================== */

function drawBlocks(){

    blockStructures.forEach(
        structure => {

            for(
                let r=0;
                r<structure.rows;
                r++
            ){

                for(
                    let c=0;
                    c<structure.cols;
                    c++
                ){

                    const x =
                    structure.x +
                    c * BRICK_W;

                    const y =
                    structure.y +
                    r * BRICK_H;


                    let question = false;


                    if(
                        structure.questions &&
                        r === 0 &&
                        (c === 2 || c === 4)
                    ){

                        question = true;

                    }


                    if(question){

                        drawQuestionBlock(
                            x,
                            y
                        );

                    }
                    else{

                        drawBrick(
                            x,
                            y
                        );

                    }

                }

            }

        }
    );

}


/* =====================================================
   PIXEL PIPE
===================================================== */

function drawPipe(){

    const x = pipe.x;
    const y = pipe.y;
    const w = pipe.w;
    const h = pipe.h;


    /* ======================
       MAIN PIPE BODY
    ====================== */

    ctx.fillStyle =
    "#079b24";

    ctx.fillRect(
        x+8,
        y+15,
        w-16,
        h-15
    );


    /* dark right */

    ctx.fillStyle =
    "#056c18";

    ctx.fillRect(
        x+w-18,
        y+15,
        10,
        h-15
    );


    /* bright middle */

    ctx.fillStyle =
    "#19d936";

    ctx.fillRect(
        x+18,
        y+17,
        14,
        h-17
    );


    /* ======================
       PIPE TOP
    ====================== */

    ctx.fillStyle =
    "#087f1d";

    ctx.fillRect(
        x,
        y,
        w,
        25
    );


    /* top bright */

    ctx.fillStyle =
    "#16cf30";

    ctx.fillRect(
        x+7,
        y+5,
        w-14,
        8
    );


    /* top middle */

    ctx.fillStyle =
    "#0ca928";

    ctx.fillRect(
        x+8,
        y+13,
        w-16,
        7
    );


    /* dark bottom edge */

    ctx.fillStyle =
    "#045b15";

    ctx.fillRect(
        x+3,
        y+21,
        w-6,
        4
    );

}


/* =====================================================
   DRAW ITEMS
===================================================== */

function drawItems(){

    items.forEach(
        item => {

            if(item.collected){
                return;
            }


            if(
                item.img.complete &&
                item.img.naturalWidth > 0
            ){

                ctx.drawImage(
                    item.img,
                    item.x,
                    item.y,
                    item.w,
                    item.h
                );

            }

        }
    );

}


/* =====================================================
   COLLISION
===================================================== */

function intersects(a,b){

    return (

        a.x <
        b.x + b.w &&

        a.x + a.w >
        b.x &&

        a.y <
        b.y + b.h &&

        a.y + a.h >
        b.y

    );

}


/* =====================================================
   PLAYER UPDATE
===================================================== */

function updatePlayer(){

    /* movement */

    if(
        keys["ArrowRight"] ||
        keys["KeyD"]
    ){

        player.velX =
        player.speed;

        player.facingLeft =
        false;

    }

    else if(
        keys["ArrowLeft"] ||
        keys["KeyA"]
    ){

        player.velX =
        -player.speed;

        player.facingLeft =
        true;

    }

    else{

        player.velX = 0;

    }


    /* jump */

    if(
        (
            keys["ArrowUp"] ||
            keys["Space"] ||
            keys["KeyW"]
        ) &&
        player.grounded
    ){

        player.velY =
        -player.jumpPower;

        player.grounded =
        false;

    }


    /* gravity */

    player.velY +=
    player.gravity;


    /* horizontal */

    player.x +=
    player.velX;


    /* remember previous bottom */

    const previousBottom =
    player.y + player.h;


    /* vertical */

    player.y +=
    player.velY;


    player.grounded =
    false;


    /* platforms */

    platforms.forEach(
        p => {

            const horizontal =
            player.x + player.w > p.x &&
            player.x < p.x + p.w;


            const landing =
            previousBottom <= p.y &&
            player.y + player.h >= p.y;


            if(
                horizontal &&
                landing &&
                player.velY >= 0
            ){

                player.y =
                p.y - player.h;

                player.velY =
                0;

                player.grounded =
                true;

            }

        }
    );


    /* screen */

    if(player.x < 0){

        player.x = 0;

    }


    if(
        player.x + player.w > W
    ){

        player.x =
        W - player.w;

    }


    /* reset if fall */

    if(
        player.y > H + 100
    ){

        player.x = 42;

        player.y =
        GROUND_Y -
        player.h;

        player.velY = 0;

    }

}


/* =====================================================
   ITEMS UPDATE
===================================================== */

function updateItems(){

    items.forEach(
        item => {

            if(item.collected){
                return;
            }


            if(
                intersects(
                    player,
                    item
                )
            ){

                item.collected =
                true;

            }

        }
    );

}


/* =====================================================
   ANIMATION
===================================================== */

function updateAnimation(){

    if(
        player.velX !== 0 &&
        player.grounded
    ){

        player.frameTimer++;


        if(
            player.frameTimer >=
            player.frameSpeed
        ){

            player.currentFrame =
            (
                player.currentFrame + 1
            ) % 3;

            player.frameTimer = 0;

        }

    }
    else{

        player.currentFrame = 0;

        player.frameTimer = 0;

    }

}


/* =====================================================
   DRAW PLAYER
===================================================== */

function drawPlayer(){

    const frames =
    player.facingLeft
    ? framesLeft
    : framesRight;


    const img =
    frames[player.currentFrame] ||
    frames[0];


    if(
        img.complete &&
        img.naturalWidth > 0
    ){

        ctx.drawImage(
            img,
            player.x,
            player.y,
            player.w,
            player.h
        );

    }

}


/* =====================================================
   DRAW
===================================================== */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /* background */

    drawBackground();


    /* bricks */

    drawBlocks();


    /* pipe */

    drawPipe();


    /* items */

    drawItems();


    /* Aryan */

    drawPlayer();

}


/* =====================================================
   UPDATE
===================================================== */

function update(){

    updatePlayer();

    updateItems();

    updateAnimation();

}


/* =====================================================
   GAME LOOP
===================================================== */

function loop(){

    update();

    draw();

    requestAnimationFrame(
        loop
    );

}

loop();


/* =====================================================
   IOS GESTURES
===================================================== */

document.addEventListener(
    "gesturestart",
    e => e.preventDefault()
);

document.addEventListener(
    "gesturechange",
    e => e.preventDefault()
);

document.addEventListener(
    "gestureend",
    e => e.preventDefault()
);

</script>

</body>
</html>
