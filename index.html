<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<title>Aryan Adventure - Frame Animation Edition</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000; overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    touch-action: none;
  }
  #stage {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  canvas {
    background: #000;
    width: 100%; max-width: 177.78vh; max-height: 56.25vw;
    outline: none; image-rendering: pixelated; image-rendering: crisp-edges;
  }
  #touch-pad {
    position: fixed; left: 0; right: 0; bottom: 24px;
    display: flex; justify-content: space-between; padding: 0 40px;
    pointer-events: none; z-index: 20; user-select: none;
  }
  .touch-group { display: flex; gap: 15px; pointer-events: auto; }
  .pad-btn {
    pointer-events: auto; width: 65px; height: 65px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(4px);
    border: 2px solid rgba(255, 255, 255, 0.5); color: #fff;
    font-size: 24px; font-weight: bold; display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .pad-btn:active, .pad-btn.active {
    background: rgba(255, 213, 79, 0.6); border-color: #ffd54f; transform: scale(0.95);
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="960" height="540" tabindex="0"></canvas>
    <div id="touch-pad">
      <div class="touch-group">
        <button id="btn-left" class="pad-btn">◀</button>
        <button id="btn-right" class="pad-btn">▶</button>
      </div>
      <div class="touch-group">
        <button id="btn-up" class="pad-btn">▲</button>
      </div>
    </div>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const pCanvas = document.createElement('canvas');
const pCtx = pCanvas.getContext('2d');

// 1. GAMBAR BACKGROUND & ITEM FLOATING (Ikut exact nama kat repo GitHub kau)
const bgImg = new Image(); bgImg.src = 'Bg .PNG';
const k1Img = new Image(); k1Img.src = 'K1.jpg.png';
const k2ItemImg = new Image(); k2ItemImg.src = 'K2.jpg.png';
const bImg = new Image(); bImg.src = 'B.jpg.png';

// 2. LOAD FRAME ARYAN (UPDATE EXTENSION KE .png)
function loadImg(src) {
  const img = new Image();
  img.src = src;
  return img;
}

const framesRight = [
  loadImg('Kd.png'),
  loadImg('K2.png'),
  loadImg('K3.png')
];

const framesLeft = [
  loadImg('Ld.png'),
  loadImg('L2.png'),
  loadImg('L3.png')
];

// 3. PLATFORM & ITEMS
const platforms = [
  { x: 0,   y: 450, w: 960, h: 90 },
  { x: 120, y: 340, w: 180, h: 20 },
  { x: 390, y: 260, w: 200, h: 20 },
  { x: 670, y: 340, w: 180, h: 20 }
];

const floatingItems = [
  { img: k1Img, x: 180, baseY: 280, w: 45, h: 45, bobOffset: 0 },
  { img: bImg,  x: 470, baseY: 200, w: 45, h: 45, bobOffset: 1.5 },
  { img: k2ItemImg, x: 730, baseY: 280, w: 45, h: 45, bobOffset: 3.0 }
];

// 4. PLAYER OBJECT
const player = {
  x: 50, y: 350, w: 55, h: 75,
  speed: 4.5, velX: 0, velY: 0,
  jumping: false, grounded: false, facingLeft: false,
  currentFrame: 0, frameTimer: 0, frameSpeed: 6
};

// 5. INPUT CONTROLS
const keys = {};
window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Enter'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

function setupTouchButton(id, keyName) {
  const btn = document.getElementById(id);
  btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; btn.classList.add('active'); });
  btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; btn.classList.remove('active'); });
}
setupTouchButton('btn-left', 'ArrowLeft');
setupTouchButton('btn-right', 'ArrowRight');
setupTouchButton('btn-up', 'ArrowUp');

// 6. UPDATE LOGIC
let globalTime = 0;
function update() {
  globalTime += 0.05;

  if (keys['ArrowRight'] || keys['KeyD']) {
    player.velX = player.speed;
    player.facingLeft = false;
  } else if (keys['ArrowLeft'] || keys['KeyA']) {
    player.velX = -player.speed;
    player.facingLeft = true;
  } else {
    player.velX = 0;
  }

  if ((keys['ArrowUp'] || keys['Space'] || keys['Enter']) && player.grounded) {
    player.velY = -12.5;
    player.grounded = false;
  }

  player.velY += 0.55;
  player.x += player.velX;
  player.y += player.velY;

  player.grounded = false;
  for (let p of platforms) {
    if (
      player.x + player.w > p.x &&
      player.x < p.x + p.w &&
      player.y + player.h >= p.y &&
      player.y + player.h - player.velY <= p.y + 10 &&
      player.velY >= 0
    ) {
      player.y = p.y - player.h;
      player.velY = 0;
      player.grounded = true;
    }
  }

  if (player.x < 0) player.x = 0;
  if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

  // ANIMASI FRAME BERJALAN & IDLE
  if (player.velX !== 0 && player.grounded) {
    player.frameTimer++;
    if (player.frameTimer >= player.frameSpeed) {
      player.currentFrame = (player.currentFrame + 1) % 3; // Loop frame 0 -> 1 -> 2
      player.frameTimer = 0;
    }
  } else {
    player.currentFrame = 0; // Bila stop, stay kat frame 0 (Kd.png / Ld.png)
  }
}

// 7. RENDER LOGIC
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (bgImg.complete && bgImg.naturalWidth !== 0) {
    ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
  }

  floatingItems.forEach(item => {
    const floatY = item.baseY + Math.sin(globalTime + item.bobOffset) * 6;
    if (item.img.complete && item.img.naturalWidth !== 0) {
      ctx.drawImage(item.img, item.x, floatY, item.w, item.h);
    }
  });

  const currentSet = player.facingLeft ? framesLeft : framesRight;
  const activeImg = currentSet[player.currentFrame];

  if (activeImg && activeImg.complete && activeImg.naturalWidth !== 0) {
    const w = activeImg.width;
    const h = activeImg.height;

    pCanvas.width = w;
    pCanvas.height = h;
    pCtx.clearRect(0, 0, w, h);
    pCtx.drawImage(activeImg, 0, 0);

    // Auto chroma key buang background hitam
    try {
      const imgData = pCtx.getImageData(0, 0, w, h);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        if (data[i] < 20 && data[i+1] < 20 && data[i+2] < 20) {
          data[i+3] = 0;
        }
      }
      pCtx.putImageData(imgData, 0, 0);
    } catch(e) {}

    ctx.drawImage(pCanvas, 0, 0, w, h, player.x, player.y, player.w, player.h);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
