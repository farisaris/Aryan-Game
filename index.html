<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<title>Aryan Adventure</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000; overflow: hidden;
    touch-action: none;
  }
  #stage {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    background: #000;
    width: 100%; max-width: 177.78vh; max-height: 56.25vw;
    image-rendering: pixelated;
  }
  #touch-pad {
    position: fixed; left: 0; right: 0; bottom: 20px;
    display: flex; justify-content: space-between; padding: 0 30px;
    pointer-events: none; z-index: 20; user-select: none;
  }
  .touch-group { display: flex; gap: 12px; pointer-events: auto; }
  .pad-btn {
    pointer-events: auto; width: 60px; height: 60px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.25);
    border: 2px solid rgba(255, 255, 255, 0.6); color: #fff;
    font-size: 22px; font-weight: bold; display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .pad-btn:active { background: rgba(255, 213, 79, 0.6); }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="960" height="540" tabindex="0"></canvas>
    <div id="touch-pad">
      <div class="touch-group">
        <button id="btn-left" class="pad-btn">◀</button>
        <button id="btn-right" class="pad-btn">▶</button>
      </div>
      <div class="touch-group">
        <button id="btn-up" class="pad-btn">▲</button>
      </div>
    </div>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function loadImg(src) {
  const img = new Image();
  img.src = src;
  return img;
}

// 1. ASSET IMAGES
const bgImg = loadImg('Bg.jpg');
const blockImg = loadImg('Bl.png');
const pipeImg = loadImg('P.png');
const bImg = loadImg('B.png');
const k1Img = loadImg('K1.png');
const k2ItemImg = loadImg('K2.png');

const framesRight = [loadImg('Rd.png'), loadImg('R1.png'), loadImg('R2.png')];
const framesLeft = [loadImg('Ld.png'), loadImg('L1.png'), loadImg('L2.png')];

// 2. BLOK BATA & PAIP
const blockGridWidth = 26;
const blockGridHeight = 22;

const blockStructures = [
  { x: 158, y: 110, cols: 3, rows: 2 },
  { x: 235, y: 300, cols: 3, rows: 2 },
  { x: 368, y: 190, cols: 3, rows: 2 },
  { x: 600, y: 92, cols: 3, rows: 2 },
  { x: 712, y: 230, cols: 7, rows: 2, hasQuestion: true }
];

const pipeData = { x: 555, y: 360, w: 68, h: 90 };

// 3. PLATFORM FIZIK
const platforms = [
  { x: 0, y: 450, w: 960, h: 90 },
  { x: 158, y: 110, w: 78, h: 44 },
  { x: 235, y: 300, w: 78, h: 44 },
  { x: 368, y: 190, w: 78, h: 44 },
  { x: 600, y: 92, w: 78, h: 44 },
  { x: 712, y: 230, w: 182, h: 44 },
  { x: pipeData.x, y: pipeData.y, w: pipeData.w, h: pipeData.h }
];

// 4. ITEM POSITIONS
const items = [
  { img: bImg, x: 257, y: 254, w: 34, h: 46, collected: false },
  { img: k1Img, x: 388, y: 136, w: 38, h: 54, collected: false },
  { img: k2ItemImg, x: 775, y: 150, w: 34, h: 80, collected: false }
];

// 5. WATAK ARYAN
const player = {
  x: 42, y: 334, w: 40, h: 116,
  speed: 4, velX: 0, velY: 0,
  grounded: false, facingLeft: false,
  currentFrame: 0, frameTimer: 0, frameSpeed: 7
};

// 6. LUKIS STRUKTUR
function drawCustomBlocks() {
  blockStructures.forEach(b => {
    for (let r = 0; r < b.rows; r++) {
      for (let c = 0; c < b.cols; c++) {
        const bx = b.x + (c * blockGridWidth);
        const by = b.y + (r * blockGridHeight);
        
        if (b.hasQuestion && r === 0 && (c === 2 || c === 4)) {
          ctx.fillStyle = '#f7b731';
          ctx.fillRect(bx, by, blockGridWidth, blockGridHeight);
          ctx.strokeStyle = '#8e44ad';
          ctx.lineWidth = 2;
          ctx.strokeRect(bx, by, blockGridWidth, blockGridHeight);
          
          ctx.fillStyle = '#000';
          ctx.font = 'bold 15px sans-serif';
          ctx.fillText('?', bx + 7, by + 16);
        } else {
          if (blockImg.complete && blockImg.naturalWidth !== 0) {
            ctx.drawImage(blockImg, bx, by, blockGridWidth, blockGridHeight);
          } else {
            ctx.fillStyle = '#b33939';
            ctx.fillRect(bx, by, blockGridWidth, blockGridHeight);
          }
        }
      }
    }
  });
}

function drawPipes() {
  if (pipeImg.complete && pipeImg.naturalWidth !== 0) {
    ctx.drawImage(pipeImg, pipeData.x, pipeData.y, pipeData.w, pipeData.h);
  }
}

// 7. INPUT CONTROLS
const keys = {};
window.addEventListener('keydown', (e) => { keys[e.code] = true; });
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

function setupTouch(id, key) {
  const btn = document.getElementById(id);
  btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
  btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
}
setupTouch('btn-left', 'ArrowLeft');
setupTouch('btn-right', 'ArrowRight');
setupTouch('btn-up', 'ArrowUp');

// 8. UPDATE LOGIC
function update() {
  if (keys['ArrowRight'] || keys['KeyD']) {
    player.velX = player.speed;
    player.facingLeft = false;
  } else if (keys['ArrowLeft'] || keys['KeyA']) {
    player.velX = -player.speed;
    player.facingLeft = true;
  } else {
    player.velX = 0;
  }

  if ((keys['ArrowUp'] || keys['Space']) && player.grounded) {
    player.velY = -12;
    player.grounded = false;
  }

  player.velY += 0.55;
  player.x += player.velX;
  player.y += player.velY;

  // Fizik Platform
  player.grounded = false;
  for (let p of platforms) {
    if (
      player.x + player.w > p.x &&
      player.x < p.x + p.w &&
      player.y + player.h >= p.y &&
      player.y + player.h - player.velY <= p.y + 14 &&
      player.velY >= 0
    ) {
      player.y = p.y - player.h;
      player.velY = 0;
      player.grounded = true;
    }
  }

  // Sempadan Skrin
  if (player.x < 0) player.x = 0;
  if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

  // Semak Kutipan Item
  items.forEach(item => {
    if (!item.collected) {
      if (
        player.x < item.x + item.w &&
        player.x + player.w > item.x &&
        player.y < item.y + item.h &&
        player.y + player.h > item.y
      ) {
        item.collected = true;
      }
    }
  });

  // Animasi Jalan
  if (player.velX !== 0 && player.grounded) {
    player.frameTimer++;
    if (player.frameTimer >= player.frameSpeed) {
      player.currentFrame = (player.currentFrame + 1) % 3;
      player.frameTimer = 0;
    }
  } else {
    player.currentFrame = 0;
  }
}

// 9. RENDER LOGIC
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (bgImg.complete && bgImg.naturalWidth !== 0) {
    ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
  }

  drawPipes();
  drawCustomBlocks();

  items.forEach(item => {
    if (!item.collected && item.img.complete && item.img.naturalWidth !== 0) {
      ctx.drawImage(item.img, item.x, item.y, item.w, item.h);
    }
  });

  const currentSet = player.facingLeft ? framesLeft : framesRight;
  const activeImg = currentSet[player.currentFrame] || currentSet[0];
  if (activeImg.complete && activeImg.naturalWidth !== 0) {
    ctx.drawImage(activeImg, player.x, player.y, player.w, player.h);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
