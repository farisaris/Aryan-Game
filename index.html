<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no,
               viewport-fit=cover">

<title>Aryan Adventure</title>

<style>
* {
  box-sizing: border-box;
  -webkit-user-select: none;
  user-select: none;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  touch-action: none;
}

#stage {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #000;
}

/* =========================================================
   GAME CANVAS
   Sentiasa 16:9
   ========================================================= */

#game {
  display: block;

  width: min(100vw, 177.7778vh);
  height: min(56.25vw, 100vh);

  aspect-ratio: 16 / 9;

  background: #000;

  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

/* =========================================================
   TOUCH CONTROLS
   ========================================================= */

#touch-pad {
  position: fixed;
  left: 0;
  right: 0;
  bottom: max(25px, env(safe-area-inset-bottom));

  display: flex;
  justify-content: space-between;
  align-items: center;

  padding-left: 30px;
  padding-right: 30px;

  pointer-events: none;
  z-index: 50;
}

.touch-group {
  display: flex;
  gap: 12px;
  pointer-events: auto;
}

.pad-btn {
  width: 64px;
  height: 64px;

  border-radius: 50%;

  border: 2px solid rgba(255,255,255,0.65);

  background: rgba(80,80,80,0.55);

  color: white;

  font-size: 25px;
  font-weight: bold;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0;
  margin: 0;

  outline: none;

  -webkit-tap-highlight-color: transparent;

  touch-action: none;
}

.pad-btn:active {
  background: rgba(255,255,255,0.35);
  transform: scale(0.96);
}
</style>
</head>

<body>

<div id="stage">

  <canvas
    id="game"
    width="960"
    height="540"
    tabindex="0">
  </canvas>

</div>

<!-- TOUCH BUTTONS -->

<div id="touch-pad">

  <div class="touch-group">
    <button id="btn-left" class="pad-btn">◀</button>
    <button id="btn-right" class="pad-btn">▶</button>
  </div>

  <div class="touch-group">
    <button id="btn-up" class="pad-btn">▲</button>
  </div>

</div>


<script>

/* =========================================================
   CANVAS
   ========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;


/* =========================================================
   ASSET LOADER
   ========================================================= */

function loadImg(src) {

  const img = new Image();

  img.src = src;

  return img;
}


/* =========================================================
   ASSETS
   ========================================================= */

const bgImg = loadImg("Bg.jpg");

const blockImg = loadImg("Bl.png");
const pipeImg = loadImg("P.png");

const bImg = loadImg("B.png");
const k1Img = loadImg("K1.png");
const k2ItemImg = loadImg("K2.png");


/* ARYAN WALKING */

const framesRight = [
  loadImg("Rd.png"),
  loadImg("R1.png"),
  loadImg("R2.png")
];

const framesLeft = [
  loadImg("Ld.png"),
  loadImg("L1.png"),
  loadImg("L2.png")
];


/* =========================================================
   WORLD SETTINGS
   ========================================================= */

const WORLD_WIDTH = 960;
const WORLD_HEIGHT = 540;


/* =========================================================
   GROUND
   ========================================================= */

const GROUND_Y = 450;


/* =========================================================
   BRICK SETTINGS
   =========================================================

   Reference image:
   960 x 540

   Brick tile:
   26 x 22

   Kita guna coordinate yang sama dengan reference.
   ========================================================= */

const BRICK_W = 26;
const BRICK_H = 22;


/* =========================================================
   BRICK STRUCTURES
   ========================================================= */

const blockStructures = [

  /* kiri atas */
  {
    x: 158,
    y: 110,
    cols: 3,
    rows: 2
  },

  /* kiri bawah */
  {
    x: 235,
    y: 300,
    cols: 3,
    rows: 2
  },

  /* tengah */
  {
    x: 368,
    y: 190,
    cols: 3,
    rows: 2
  },

  /* kanan atas */
  {
    x: 600,
    y: 92,
    cols: 3,
    rows: 2
  },

  /* kanan question blocks */
  {
    x: 712,
    y: 230,
    cols: 7,
    rows: 2,
    hasQuestion: true
  }

];


/* =========================================================
   PIPE
   ========================================================= */

const pipeData = {

  x: 555,
  y: 360,

  w: 68,
  h: 90

};


/* =========================================================
   PHYSICS PLATFORMS
   =========================================================

   IMPORTANT:
   Brick dan pipe collision hanya pada bahagian atas.
   ========================================================= */

const platforms = [

  /* ground */
  {
    x: 0,
    y: GROUND_Y,
    w: 960,
    h: 90
  },

  /* brick platforms */

  {
    x: 158,
    y: 110,
    w: BRICK_W * 3,
    h: BRICK_H
  },

  {
    x: 235,
    y: 300,
    w: BRICK_W * 3,
    h: BRICK_H
  },

  {
    x: 368,
    y: 190,
    w: BRICK_W * 3,
    h: BRICK_H
  },

  {
    x: 600,
    y: 92,
    w: BRICK_W * 3,
    h: BRICK_H
  },

  {
    x: 712,
    y: 230,
    w: BRICK_W * 7,
    h: BRICK_H
  },

  /* PIPE TOP SAHAJA */

  {
    x: pipeData.x,
    y: pipeData.y,
    w: pipeData.w,
    h: 12
  }

];


/* =========================================================
   ITEMS
   ========================================================= */

const items = [

  {
    img: bImg,

    x: 257,
    y: 254,

    w: 34,
    h: 46,

    collected: false
  },

  {
    img: k1Img,

    x: 388,
    y: 136,

    w: 38,
    h: 54,

    collected: false
  },

  {
    img: k2ItemImg,

    x: 775,
    y: 150,

    w: 34,
    h: 80,

    collected: false
  }

];


/* =========================================================
   ARYAN
   ========================================================= */

const player = {

  x: 42,
  y: GROUND_Y - 116,

  w: 40,
  h: 116,

  speed: 4,

  velX: 0,
  velY: 0,

  gravity: 0.55,

  jumpPower: 12,

  grounded: false,

  facingLeft: false,

  currentFrame: 0,

  frameTimer: 0,

  frameSpeed: 7

};


/* =========================================================
   INPUT
   ========================================================= */

const keys = {};


/* KEYBOARD */

window.addEventListener("keydown", function(e) {

  keys[e.code] = true;

  if (
    e.code === "ArrowLeft" ||
    e.code === "ArrowRight" ||
    e.code === "ArrowUp" ||
    e.code === "Space"
  ) {
    e.preventDefault();
  }

});


window.addEventListener("keyup", function(e) {

  keys[e.code] = false;

});


/* =========================================================
   TOUCH CONTROL
   ========================================================= */

function setupTouch(id, key) {

  const btn = document.getElementById(id);

  function press(e) {

    e.preventDefault();

    keys[key] = true;

  }

  function release(e) {

    e.preventDefault();

    keys[key] = false;

  }


  btn.addEventListener(
    "touchstart",
    press,
    { passive: false }
  );

  btn.addEventListener(
    "touchend",
    release,
    { passive: false }
  );

  btn.addEventListener(
    "touchcancel",
    release,
    { passive: false }
  );


  /* Support mouse too */

  btn.addEventListener(
    "mousedown",
    press
  );

  btn.addEventListener(
    "mouseup",
    release
  );

  btn.addEventListener(
    "mouseleave",
    release
  );

}


setupTouch("btn-left", "ArrowLeft");

setupTouch("btn-right", "ArrowRight");

setupTouch("btn-up", "ArrowUp");


/* =========================================================
   DRAW BACKGROUND
   ========================================================= */

function drawBackground() {

  if (
    bgImg.complete &&
    bgImg.naturalWidth > 0
  ) {

    ctx.drawImage(
      bgImg,
      0,
      0,
      WORLD_WIDTH,
      WORLD_HEIGHT
    );

  }

}


/* =========================================================
   DRAW BRICKS
   ========================================================= */

function drawCustomBlocks() {

  blockStructures.forEach(function(structure) {

    for (
      let row = 0;
      row < structure.rows;
      row++
    ) {

      for (
        let col = 0;
        col < structure.cols;
        col++
      ) {

        const x =
          structure.x +
          col * BRICK_W;

        const y =
          structure.y +
          row * BRICK_H;


        /*
         * QUESTION BLOCK
         *
         * Position:
         * top row
         * column 2 & 4
         */

        const isQuestion =
          structure.hasQuestion &&
          row === 0 &&
          (col === 2 || col === 4);


        if (isQuestion) {

          drawQuestionBlock(
            x,
            y
          );

        }

        else {

          drawBrick(
            x,
            y
          );

        }

      }

    }

  });

}


/* =========================================================
   DRAW NORMAL BRICK
   ========================================================= */

function drawBrick(x, y) {

  /*
   * Cuba guna asset asal.
   *
   * Kalau Bl.png mempunyai transparent padding,
   * kita crop keseluruhan image supaya brick tak
   * nampak macam garisan.
   */

  if (
    blockImg.complete &&
    blockImg.naturalWidth > 0
  ) {

    ctx.drawImage(
      blockImg,
      0,
      0,
      blockImg.naturalWidth,
      blockImg.naturalHeight,
      x,
      y,
      BRICK_W,
      BRICK_H
    );

  }

  else {

    /* fallback brick */

    ctx.fillStyle = "#a94b24";

    ctx.fillRect(
      x,
      y,
      BRICK_W,
      BRICK_H
    );

    ctx.strokeStyle = "#5a2514";

    ctx.lineWidth = 2;

    ctx.strokeRect(
      x,
      y,
      BRICK_W,
      BRICK_H
    );

  }

}


/* =========================================================
   QUESTION BLOCK
   ========================================================= */

function drawQuestionBlock(x, y) {

  ctx.fillStyle = "#f7b731";

  ctx.fillRect(
    x,
    y,
    BRICK_W,
    BRICK_H
  );


  ctx.strokeStyle = "#8e44ad";

  ctx.lineWidth = 2;

  ctx.strokeRect(
    x + 1,
    y + 1,
    BRICK_W - 2,
    BRICK_H - 2
  );


  ctx.fillStyle = "#fff";

  ctx.font =
    "bold 16px Arial";

  ctx.textAlign = "center";

  ctx.textBaseline = "middle";


  ctx.fillText(
    "?",
    x + BRICK_W / 2,
    y + BRICK_H / 2 + 1
  );


  ctx.textAlign = "left";

  ctx.textBaseline = "alphabetic";

}


/* =========================================================
   DRAW PIPE
   ========================================================= */

function drawPipe() {

  if (
    pipeImg.complete &&
    pipeImg.naturalWidth > 0
  ) {

    ctx.drawImage(
      pipeImg,
      0,
      0,
      pipeImg.naturalWidth,
      pipeImg.naturalHeight,
      pipeData.x,
      pipeData.y,
      pipeData.w,
      pipeData.h
    );

  }

}


/* =========================================================
   DRAW ITEMS
   ========================================================= */

function drawItems() {

  items.forEach(function(item) {

    if (item.collected) {
      return;
    }


    if (
      item.img.complete &&
      item.img.naturalWidth > 0
    ) {

      ctx.drawImage(
        item.img,
        0,
        0,
        item.img.naturalWidth,
        item.img.naturalHeight,
        item.x,
        item.y,
        item.w,
        item.h
      );

    }

  });

}


/* =========================================================
   COLLISION HELPER
   ========================================================= */

function intersects(a, b) {

  return (

    a.x < b.x + b.w &&

    a.x + a.w > b.x &&

    a.y < b.y + b.h &&

    a.y + a.h > b.y

  );

}


/* =========================================================
   UPDATE PLAYER
   ========================================================= */

function updatePlayer() {

  /* -------------------------------------
     MOVEMENT
     ------------------------------------- */

  if (
    keys["ArrowRight"] ||
    keys["KeyD"]
  ) {

    player.velX = player.speed;

    player.facingLeft = false;

  }

  else if (
    keys["ArrowLeft"] ||
    keys["KeyA"]
  ) {

    player.velX = -player.speed;

    player.facingLeft = true;

  }

  else {

    player.velX = 0;

  }


  /* -------------------------------------
     JUMP
     ------------------------------------- */

  if (
    (
      keys["ArrowUp"] ||
      keys["Space"] ||
      keys["KeyW"]
    ) &&
    player.grounded
  ) {

    player.velY =
      -player.jumpPower;

    player.grounded = false;

  }


  /* -------------------------------------
     GRAVITY
     ------------------------------------- */

  player.velY += player.gravity;


  /* -------------------------------------
     HORIZONTAL
     ------------------------------------- */

  player.x += player.velX;


  /* -------------------------------------
     VERTICAL
     ------------------------------------- */

  const previousBottom =
    player.y + player.h;

  player.y += player.velY;


  player.grounded = false;


  /* -------------------------------------
     PLATFORM COLLISION
     ------------------------------------- */

  for (
    let i = 0;
    i < platforms.length;
    i++
  ) {

    const p = platforms[i];


    const horizontalCollision =
      player.x + player.w > p.x &&
      player.x < p.x + p.w;


    const crossedPlatform =
      previousBottom <= p.y &&
      player.y + player.h >= p.y;


    if (
      horizontalCollision &&
      crossedPlatform &&
      player.velY >= 0
    ) {

      player.y =
        p.y - player.h;

      player.velY = 0;

      player.grounded = true;

    }

  }


  /* -------------------------------------
     SCREEN BOUNDARIES
     ------------------------------------- */

  if (player.x < 0) {

    player.x = 0;

  }


  if (
    player.x + player.w >
    WORLD_WIDTH
  ) {

    player.x =
      WORLD_WIDTH - player.w;

  }


  /* -------------------------------------
     FALL PROTECTION
     ------------------------------------- */

  if (player.y > WORLD_HEIGHT + 100) {

    player.x = 42;

    player.y =
      GROUND_Y - player.h;

    player.velY = 0;

  }

}


/* =========================================================
   COLLECT ITEMS
   ========================================================= */

function updateItems() {

  items.forEach(function(item) {

    if (item.collected) {
      return;
    }


    if (intersects(player, item)) {

      item.collected = true;

    }

  });

}


/* =========================================================
   WALKING ANIMATION
   ========================================================= */

function updateAnimation() {

  if (
    player.velX !== 0 &&
    player.grounded
  ) {

    player.frameTimer++;


    if (
      player.frameTimer >=
      player.frameSpeed
    ) {

      player.currentFrame =
        (
          player.currentFrame + 1
        ) % 3;

      player.frameTimer = 0;

    }

  }

  else {

    player.currentFrame = 0;

    player.frameTimer = 0;

  }

}


/* =========================================================
   DRAW ARYAN
   ========================================================= */

function drawPlayer() {

  const frames =
    player.facingLeft
      ? framesLeft
      : framesRight;


  const img =
    frames[player.currentFrame] ||
    frames[0];


  if (
    img.complete &&
    img.naturalWidth > 0
  ) {

    ctx.drawImage(
      img,
      0,
      0,
      img.naturalWidth,
      img.naturalHeight,
      player.x,
      player.y,
      player.w,
      player.h
    );

  }

}


/* =========================================================
   MAIN UPDATE
   ========================================================= */

function update() {

  updatePlayer();

  updateItems();

  updateAnimation();

}


/* =========================================================
   MAIN DRAW
   ========================================================= */

function draw() {

  ctx.clearRect(
    0,
    0,
    WORLD_WIDTH,
    WORLD_HEIGHT
  );


  /* Background */

  drawBackground();


  /* Pipe */

  drawPipe();


  /* Bricks */

  drawCustomBlocks();


  /* Items */

  drawItems();


  /* Aryan */

  drawPlayer();

}


/* =========================================================
   GAME LOOP
   ========================================================= */

function gameLoop() {

  update();

  draw();

  requestAnimationFrame(
    gameLoop
  );

}


/* =========================================================
   START
   ========================================================= */

gameLoop();


/* =========================================================
   PREVENT IOS GESTURES
   ========================================================= */

document.addEventListener(
  "gesturestart",
  function(e) {
    e.preventDefault();
  }
);

document.addEventListener(
  "gesturechange",
  function(e) {
    e.preventDefault();
  }
);

document.addEventListener(
  "gestureend",
  function(e) {
    e.preventDefault();
  }
);

</script>

</body>
</html>
